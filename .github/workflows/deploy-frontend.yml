name: Deploy Frontend

# Single-job build + deploy with bulletin-deploy, retried in a shell loop.
# Both push-to-main and PRs deploy to a live, resolvable domain — main to the
# fixed `terminal.paseo`, PRs to a `pr<N>-` prefixed preview. The only difference:
# `--publish` is passed ONLY on main. `--publish` registers the full Polkadot
# product manifest (icon/displayName/app.<domain> subname) — i.e. it PINS the
# bundle into the app's product registry. Without it the domain still resolves
# and the preview is live/scannable; it just isn't pinned as a product.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip-cache:
        description: 'Force redeploy (skip cache)'
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The dotNS key comes from a GitHub Environment: `preview` for PR runs,
    # `production` for main and manual runs. Each environment carries its own
    # DOTNS_MNEMONIC secret (an environment secret overrides the repository
    # one), so a PR branch never holds the key that owns `terminal.paseo`, and
    # `production` can be limited to the main branch in the repo settings.
    environment: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        # Exactly the reviewed tree in package-lock.json (it lists the Linux
        # native packages too, so npm bug #4828 no longer applies), with no
        # dependency install scripts: none of ours needs one — esbuild,
        # unrs-resolver and sharp find their prebuilt platform packages, and
        # core-js only prints a banner. npm itself is pinned to the version
        # that wrote the lockfile.
        run: |
          npm install -g npm@11.20.0
          npm --version
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate PAPI descriptors
        run: npm run papi:generate

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_COMMIT_SHA: ${{ github.sha }}
          # NEXT_PUBLIC_* are baked into the JS bundle at build — must live on
          # this step, not on Deploy (where they'd be a no-op).
          # Contract wiring. CI has no .env.local (gitignored) and never runs
          # the contract deploy, so without these the build bakes the
          # lib/contracts/config.ts defaults. They're public values, so they
          # live in repo *variables*, not secrets. Unset → empty string →
          # config.ts falls back to its (paseo-next-v2) defaults, which is the
          # safe behavior. Set the variable after a chain reset + redeploy to
          # point CI builds at the new contract without a code change.
          NEXT_PUBLIC_NETWORK: ${{ vars.NEXT_PUBLIC_NETWORK }}
          NEXT_PUBLIC_BULLETIN_INDEX_ADDRESS: ${{ vars.NEXT_PUBLIC_BULLETIN_INDEX_ADDRESS }}

      # Kubo straight from its GitHub release. The download action fetched it
      # from dist.ipfs.tech with no timeout; when that host stopped answering
      # (2026-10-20) every deploy hung ~30 min in this step and then failed.
      # The action's v2 reads GitHub releases, but it requires a published
      # SHA-256 digest, which v0.33.0 lacks, so the release's own .sha512
      # checks the archive here instead.
      - name: Setup IPFS
        timeout-minutes: 5
        run: |
          KUBO=v0.33.0
          FILE="kubo_${KUBO}_linux-amd64.tar.gz"
          BASE="https://github.com/ipfs/kubo/releases/download/${KUBO}"
          curl -fsSL --retry 5 --connect-timeout 20 --max-time 300 -O "$BASE/$FILE" -O "$BASE/$FILE.sha512"
          sha512sum -c "$FILE.sha512"
          tar -xzf "$FILE"
          sudo install kubo/ipfs /usr/local/bin/ipfs
          ipfs version
      - run: ipfs init

      - name: Install deploy tool
        # Pinned, not @latest, so a new bulletin-deploy release can't break the
        # deploy the day it ships. Bump deliberately, together with
        # BULLETIN_DEPLOY_VERSION in scripts/deploy.ts.
        run: npm install -g bulletin-deploy@0.24.1

      - name: Deploy
        # PR previews deploy to a `pr<N>-` prefixed name, main to the fixed
        # `terminal.paseo`. Both are live and resolvable.
        #
        # TLD: paseo-next-v2's dotNS uses `.paseo` (bulletin-deploy ≥ 0.15
        # rejects `.dot` names on this env), and the Polkadot nightly apps
        # only open `.paseo` products.
        #
        # BULLETIN_DEPLOY_DOMAIN is exported so `bulletin-deploy.config.ts`
        # sees the same value the CLI is invoked with — without this the
        # config's hardcoded default ("terminal.paseo") would fight a
        # PR-preview deploy and the manifest step aborts.
        #
        # Retried here rather than through a third-party retry action, so the
        # mnemonic only ever reaches bulletin-deploy itself.
        timeout-minutes: 50
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            DOMAIN="pr${PR_NUMBER}-terminal.paseo"
          else
            DOMAIN="terminal.paseo"
          fi
          export BULLETIN_DEPLOY_DOMAIN="$DOMAIN"
          for attempt in 1 2 3; do
            if timeout 15m bulletin-deploy --env paseo-next-v2 './out' "$DOMAIN"; then
              exit 0
            fi
            echo "::warning::bulletin-deploy attempt $attempt of 3 failed"
            if [ "$attempt" -lt 3 ]; then sleep 30; fi
          done
          exit 1
        env:
          MNEMONIC: ${{ secrets.DOTNS_MNEMONIC }}
          NODE_OPTIONS: '--max-old-space-size=8192'
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Comment on PR
        # Skip for fork PRs: `pull_request` from a fork runs with a read-only
        # GITHUB_TOKEN regardless of the job-level `pull-requests: write`
        # permission (security default — avoids fork PRs writing to upstream).
        # The `issues/<n>/comments` API returns 403 "Resource not accessible
        # by integration" and the whole deploy job fails. Branch PRs from the
        # same repo still get the preview comment.
        if: github.event.pull_request && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const domain = `pr${{ github.event.pull_request.number }}-terminal`;
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `**${domain}.paseo** · [logs](${runUrl})\n\nhttps://${domain}.paseo.li`
            });
